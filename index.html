<title>Tribal Tally</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap"><style id="page-style">/* Layout: torch-lit night hero band, tab bar, then one 1040px column (podium, standings list, castaway cards, rules).
   Deliberately one look (night at tribal council), so there is no light theme. */
:root {
  --night: #0c1310; --canopy: #142019; --canopy-2: #1b2a21; --line: #2b3d31;
  --sand: #eee2c6; --sand-dim: #a9a088; --flame: #ff7a2f; --ember: #ffb547; --lagoon: #3fb8a8;
  --orchid: #c39be6; --clay: #e0684b; --ash: #6b746c;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
body { background: var(--night); color: var(--sand); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h2 { font-size: clamp(30px, 5vw, 40px); font-weight: 800; text-transform: uppercase; }
h3 { font-size: 22px; font-weight: 800; text-transform: uppercase; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ember); font-weight: 700; }
.muted { color: var(--sand-dim); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--ember); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 4px; }

/* Bamboo divider: a row of culms with nodes */
.bamboo { height: 10px; border-radius: 5px;
  background:
    repeating-linear-gradient(90deg, transparent 0 58px, rgba(0,0,0,.45) 58px 61px),
    linear-gradient(180deg, #c9a45a, #8a6a2c); opacity: .85; }

/* Hero */
.hero { position: relative; overflow: hidden; margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 40px); padding-bottom: 36px;
  background:
    radial-gradient(420px 300px at 8% 100%, rgba(255,122,47,.28), transparent 70%),
    radial-gradient(420px 300px at 92% 100%, rgba(255,122,47,.24), transparent 70%),
    linear-gradient(180deg, #08100c 0%, #10211a 70%, #142019 100%); }
.hero .col { position: relative; display: grid; gap: 22px; }
.brand { display: flex; align-items: flex-end; gap: 14px; }
.brand svg { width: 34px; height: 68px; flex: none; }
.wordmark { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .82;
  font-size: clamp(56px, 13vw, 120px); letter-spacing: 0.005em; margin: 0;
  background: linear-gradient(180deg, #ffe2a8 0%, var(--ember) 45%, var(--flame) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { font-size: 17px; color: var(--sand); max-width: 60ch; }
.tagline b { color: var(--ember); font-weight: 700; }
.leaders { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.leader { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  background: rgba(20,32,25,.75); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.leader .icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--canopy-2); }
.leader .icon svg { width: 24px; height: 24px; }
.leader .who { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; }
.leader .pts { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--ember); }
.leader .pts small { font-size: 14px; color: var(--sand-dim); margin-left: 2px; }

.flame { transform-origin: 50% 90%; }
@media (prefers-reduced-motion: no-preference) {
  .flame { animation: flicker 2.6s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform: scale(1,1) } 30% { transform: scale(.94,1.05) } 60% { transform: scale(1.04,.96) } }
}

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: rgba(12,19,16,.92);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
.tabs .col { display: flex; gap: 4px; overflow-x: auto; }
.tabs a { flex: none; padding: 14px 14px 12px; color: var(--sand-dim); text-decoration: none; font-weight: 700;
  font-size: 14px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 3px solid transparent; }
.tabs a[aria-current="page"] { color: var(--sand); border-bottom-color: var(--flame); }
.tabs a:hover { color: var(--sand); }

main.col { display: grid; gap: 40px; padding-block: 32px 64px; }
section { display: grid; gap: 16px; }
.sechead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }

/* Podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.step { display: grid; gap: 10px; align-content: end; text-align: center; }
.step .names { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 3.4vw, 28px); text-transform: uppercase; line-height: 1.05; }
.step .score { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 5vw, 40px); color: var(--ember); }
.block { border-radius: 10px 10px 4px 4px; display: grid; place-items: center; font-family: var(--display); font-weight: 900;
  font-size: clamp(34px, 7vw, 56px); color: rgba(12,19,16,.75);
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 22%, rgba(0,0,0,.22) 22% 23.5%), linear-gradient(180deg, #d8b468, #9a7432); }
.step.p1 .block { height: 128px; } .step.p2 .block { height: 96px; } .step.p3 .block { height: 72px; }
.step.p1 { order: 2; } .step.p2 { order: 1; } .step.p3 { order: 3; }

/* Standings list */
.board { display: grid; gap: 8px; }
.entry { background: var(--canopy); border: 1px solid var(--line); border-radius: 12px; }
.entry > button { width: 100%; background: none; border: 0; text-align: left; padding: 12px 14px;
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.rank { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; text-align: center; }
.move { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; margin-top: 2px; }
.move.up { color: var(--lagoon); } .move.down { color: var(--clay); } .move.same { color: var(--ash); }
.who { display: grid; gap: 6px; min-width: 0; }
.who .name { font-weight: 700; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; font-size: 13px; padding: 2px 9px 3px; border-radius: 999px;
  background: var(--canopy-2); border: 1px solid var(--line); white-space: nowrap; }
.chip .t { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.chip .p { color: var(--sand-dim); font-variant-numeric: tabular-nums; }
.chip.savu .t { color: var(--lagoon); } .chip.toka .t { color: var(--ember); }
.chip.wild .t { color: var(--orchid); } .chip.merge .t { color: var(--flame); }
.chip.merge { border-color: rgba(255,122,47,.45); }
.out { color: var(--ash); text-decoration: line-through; text-decoration-thickness: 1px; }
.score-col { display: grid; justify-items: end; gap: 4px; }
.total { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--sand); }
.torches { display: flex; gap: 3px; }
.torches svg { width: 12px; height: 24px; }
.detail { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(28px, 1fr); gap: 6px; align-items: end; height: 120px; overflow-x: auto; }
.bar { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; height: 100%; font-size: 12px; }
.bar .v { color: var(--sand); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar .fill { align-self: end; width: 70%; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--ember), var(--flame)); min-height: 2px; }
.bar.post .fill { background: linear-gradient(180deg, #ffd08a, var(--clay)); }
.bar .e { color: var(--sand-dim); }

/* Castaways */
.castgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.cast { background: var(--canopy); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.cast .top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.cast .nm { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; }
.cast .tot { font-family: var(--display); font-weight: 900; font-size: 32px; color: var(--ember); line-height: 1; }
.cast.isout { background: transparent; }
.cast.isout .nm, .cast.isout .tot { color: var(--ash); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.status svg { width: 9px; height: 18px; }
.status.in { color: var(--lagoon); } .status.gone { color: var(--ash); }
.split { display: flex; gap: 14px; font-size: 13px; color: var(--sand-dim); }
.split b { color: var(--sand); font-variant-numeric: tabular-nums; }

/* Rules */
.rulegroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.rulegroup { background: var(--canopy); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.rulegroup ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rulegroup li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; font-size: 14px; }
.pv { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; color: var(--ember); }
.pv.neg { color: var(--clay); }
.howto { background: var(--canopy-2); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; max-width: 75ch; }
.howto p { margin: 0; }

footer.col { padding-block: 0 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--sand-dim); font-size: 13px; }

/* Admin */
.btn { font-weight: 700; border-radius: 8px; border: 1px solid var(--line); background: var(--canopy-2); color: var(--sand); padding: 8px 14px; }
.btn.primary { background: var(--flame); border-color: var(--flame); color: #1a0c04; }
.btn:disabled { opacity: .45; cursor: default; }
.panel { background: var(--canopy); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.login { max-width: 400px; }
.login form { display: grid; gap: 10px; }
.login input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--night); color: var(--sand); }
.err { color: var(--clay); font-weight: 700; }
.ok { color: var(--lagoon); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab { padding: 6px 12px; border-radius: 999px; font-weight: 700; }
.tab[aria-pressed="true"] { background: var(--sand); color: var(--night); border-color: var(--sand); }
.vote { border-radius: 999px; padding: 4px 12px; font-weight: 600; }
.vote[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); color: #1a0c04; }
.scroll { overflow-x: auto; background: var(--canopy); border: 1px solid var(--line); border-radius: 12px; }
table.grid { border-collapse: collapse; width: 100%; }
.grid td, .grid th { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.grid th.c { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; font-weight: 700; padding: 10px 4px; vertical-align: bottom; text-align: left; }
.grid .rule { position: sticky; left: 0; background: var(--canopy); min-width: 220px; max-width: 300px; font-size: 13px; line-height: 1.3; z-index: 1; text-align: left; }
.grid .rule .pv { display: inline-block; min-width: 2.4em; font-size: 16px; margin-right: 6px; }
.grid tr.group td { background: var(--canopy-2); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--sand-dim); }
.grid input { width: 2.6em; font: inherit; font-variant-numeric: tabular-nums; text-align: center; padding: 4px 2px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--night); color: var(--sand); }
.grid input.has { background: var(--flame); border-color: var(--flame); color: #1a0c04; font-weight: 800; }
.grid tfoot td { font-family: var(--display); font-weight: 800; font-size: 18px; text-align: center; border-top: 2px solid var(--ember); border-bottom: 0; }
.grid tfoot td.rule { font-family: var(--body); font-size: 13px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--canopy); border-top: 1px solid var(--line); z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.savebar .inner { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.adminwrap { max-width: 1400px; margin: 0 auto; padding-block: 28px 110px; display: grid; gap: 20px; }

@media (max-width: 560px) {
  .entry > button { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px; }
  .rank { font-size: 24px; } .total { font-size: 28px; }
  .podium { gap: 8px; }
}

// Fantasy Survivor scoring engine. Pure functions over season.json; no DOM, no I/O,
// so the same file runs in Node (tests) and in the browser (the site).
//
// Scoring model (matches the spreadsheet):
//  - A castaway's episode score = sum(rule points x times it happened).
//  - Pre-merge episodes (firstScoredEpisode .. mergeEpisode-1): an entrant scores
//    the Savu, Toka and Wildcard picks.
//  - Post-merge episodes (mergeEpisode onward): an entrant scores the two Merge picks.
//  - Standings rank by total, ties share a rank (1, 1, 3 ...).

function validate(season) {
  const errors = [];
  const ruleIds = new Set(season.rules.map(r => r.id));
  const names = new Set(season.castaways.map(c => c.name));
  if (ruleIds.size !== season.rules.length) errors.push("duplicate rule id");
  if (names.size !== season.castaways.length) errors.push("duplicate castaway name");
  const seen = new Set();
  for (const e of season.entrants) {
    if (seen.has(e.name)) errors.push(`duplicate entrant ${e.name}`);
    seen.add(e.name);
    const { savu, toka, wildcard, merge } = e.picks;
    for (const p of [savu, toka, wildcard, ...(merge || [])]) {
      if (p != null && !names.has(p)) errors.push(`${e.name}: unknown castaway "${p}"`);
    }
    if (merge && merge[0] && merge[0] === merge[1]) errors.push(`${e.name}: same castaway picked twice at merge`);
  }
  for (const ep of season.episodes) {
    for (const [who, counts] of Object.entries(ep.events)) {
      if (!names.has(who)) errors.push(`Episode ${ep.number}: unknown castaway "${who}"`);
      for (const [rid, n] of Object.entries(counts)) {
        if (!ruleIds.has(rid)) errors.push(`Episode ${ep.number}: unknown rule "${rid}"`);
        if (!Number.isInteger(n) || n < 0) errors.push(`Episode ${ep.number}: bad count ${n} for ${who}/${rid}`);
      }
    }
  }
  return errors;
}

const isPostMerge = (season, n) => n >= season.mergeEpisode;
const scoredEpisodes = season =>
  season.episodes.filter(e => e.number >= season.firstScoredEpisode);

// Latest episode that has any scoring recorded (an empty sheet doesn't count).
function latestScoredEpisode(season) {
  const done = scoredEpisodes(season).filter(e => Object.keys(e.events).length);
  return done.length ? done[done.length - 1].number : null;
}

// { castaway: { episodeNumber: points } } for every castaway and scored episode.
function castawayEpisodePoints(season) {
  const pts = Object.fromEntries(season.rules.map(r => [r.id, r.points]));
  const out = {};
  for (const c of season.castaways) out[c.name] = {};
  for (const ep of scoredEpisodes(season)) {
    for (const c of season.castaways) {
      const counts = ep.events[c.name] || {};
      out[c.name][ep.number] = Object.entries(counts)
        .reduce((s, [rid, n]) => s + (pts[rid] ?? 0) * n, 0);
    }
  }
  return out;
}

// Per castaway: preMerge, postMerge, total, eliminatedEpisode, byEpisode.
function castawayTotals(season) {
  const byEp = castawayEpisodePoints(season);
  return season.castaways.map(c => {
    let pre = 0, post = 0;
    for (const [n, p] of Object.entries(byEp[c.name])) {
      if (isPostMerge(season, +n)) post += p; else pre += p;
    }
    return { name: c.name, eliminatedEpisode: c.eliminatedEpisode ?? null,
             preMerge: pre, postMerge: post, total: pre + post, byEpisode: byEp[c.name] };
  });
}

// Standard competition ranking on `key`, descending.
function rank(rows, key) {
  const sorted = [...rows].sort((a, b) => b[key] - a[key] || a.name.localeCompare(b.name));
  sorted.forEach((r, i) => { r.rank = i && r[key] === sorted[i - 1][key] ? sorted[i - 1].rank : i + 1; });
  return sorted;
}

// Full standings: one row per entrant, sorted, with weekly breakdown.
function standings(season) {
  const cast = Object.fromEntries(castawayTotals(season).map(c => [c.name, c]));
  const get = n => cast[n] || { preMerge: 0, postMerge: 0, byEpisode: {}, eliminatedEpisode: null };
  const rows = season.entrants.map(e => {
    const { savu, toka, wildcard, merge = [] } = e.picks;
    const prePicks = [savu, toka, wildcard];
    const picks = {
      savu: { castaway: savu, points: get(savu).preMerge },
      toka: { castaway: toka, points: get(toka).preMerge },
      wildcard: { castaway: wildcard, points: get(wildcard).preMerge },
      merge: { castaways: merge, points: merge.reduce((s, m) => s + get(m).postMerge, 0) },
    };
    const byEpisode = {};
    for (const ep of scoredEpisodes(season)) {
      const team = isPostMerge(season, ep.number) ? merge : prePicks;
      byEpisode[ep.number] = team.reduce((s, m) => s + (get(m).byEpisode[ep.number] ?? 0), 0);
    }
    const total = picks.savu.points + picks.toka.points + picks.wildcard.points + picks.merge.points;
    const picksRemaining = merge.filter(m => m && get(m).eliminatedEpisode == null).length;
    return { name: e.name, total, picks, byEpisode, picksRemaining };
  });
  return rank(rows, "total");
}

// Top castaway(s) and entrant(s) for one episode (defaults to the latest scored).
// Returns arrays so ties are kept.
function weeklyLeaders(season, episode = latestScoredEpisode(season)) {
  if (episode == null) {
    return { episode: null, survivorOfTheWeek: { points: 0, names: [] }, playerOfTheWeek: { points: 0, names: [] } };
  }
  const top = (rows, get) => {
    const best = Math.max(...rows.map(get));
    return { points: best, names: rows.filter(r => get(r) === best).map(r => r.name) };
  };
  return {
    episode,
    survivorOfTheWeek: top(castawayTotals(season), c => c.byEpisode[episode] ?? 0),
    playerOfTheWeek: top(standings(season), s => s.byEpisode[episode] ?? 0),
  };
}

return { validate, latestScoredEpisode, castawayEpisodePoints, castawayTotals, standings, weeklyLeaders };
})();
